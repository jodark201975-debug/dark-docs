<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Dark AI Docs Pro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Tahoma;
    text-align:center;
    padding:30px;
}
.container{
    max-width:800px;
    margin:auto;
}
textarea{
    width:100%;
    height:150px;
    border-radius:10px;
    padding:10px;
}
select,button{
    margin-top:10px;
    padding:10px;
    border:none;
    border-radius:8px;
}
button{
    background:#22c55e;
    color:white;
    cursor:pointer;
}
#output{
    background:white;
    color:black;
    padding:20px;
    border-radius:10px;
    margin-top:20px;
    text-align:right;
}
</style>

</head>

<body>

<div class="container">

<h1>🔥 Dark AI Docs Pro</h1>

<textarea id="input" placeholder="اكتب طلبك (قصة - مقال - سيناريو)..."></textarea>

<br>

<select id="type">
<option value="article">مقال احترافي</option>
<option value="story">قصة</option>
<option value="cinematic">برومبت سينمائي</option>
</select>

<br>

<button onclick="generate()">✨ Generate AI</button>

<div id="output"></div>

<button onclick="downloadPDF()">📥 تحميل PDF</button>

</div>

<script>

async function generate(){

let text = document.getElementById("input").value;
let type = document.getElementById("type").value;

if(!text){
    alert("اكتب حاجة");
    return;
}

let prompt = "";

if(type==="article"){
prompt = "اكتب مقال احترافي للنشر على امازون KDP عن: " + text;
}
else if(type==="story"){
prompt = "اكتب قصة مشوقة وجذابة عن: " + text;
}
else{
prompt = "اكتب برومبت سينمائي احترافي جدا بالتفاصيل (كاميرا، اضاءة، مشاهد) عن: " + text;
}

let response = await fetch("https://api.openai.com/v1/chat/completions",{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer YOUR_API_KEY"
},
body:JSON.stringify({
model:"gpt-4o-mini",
messages:[
{role:"user",content:prompt}
]
})
});

let data = await response.json();

let result = data.choices[0].message.content;

document.getElementById("output").innerText = result;

}

async function downloadPDF(){

let content = document.getElementById("output").innerText;

if(!content){
alert("اعمل Generate الأول");
return;
}

const { jsPDF } = window.jspdf;
const doc = new jsPDF();

let lines = doc.splitTextToSize(content, 180);

doc.text(lines, 10, 10);

doc.save("KDP-Book.pdf");

}

</script>

</body>
</html>
