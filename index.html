<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dark Docs</title>

<script src="https://js.puter.com/v2/"></script>

<style>
body{
    font-family: Arial;
    background:#f4efe6;
    text-align:center;
    padding:40px;
}
.container{
    max-width:600px;
    margin:auto;
}
h1{
    color:#5a3e2b;
}
textarea{
    width:100%;
    height:150px;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
}
button{
    margin-top:15px;
    padding:12px 20px;
    background:#5a3e2b;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
#output{
    margin-top:20px;
    background:white;
    padding:15px;
    border-radius:8px;
    text-align:left;
    min-height:100px;
}
.pay{
    margin-top:20px;
    background:#000;
}
</style>

</head>

<body>

<div class="container">

<h1>Dark Docs</h1>
<p>Turn Ideas Into Professional Documents Instantly</p>

<textarea id="input" placeholder="Write what you want..."></textarea>

<button onclick="generate()">Generate</button>

<div id="output"></div>

<button class="pay" onclick="pay()">Download PDF</button>

</div>

<script>

function generate(){
let text = document.getElementById("input").value;

```
if(!text){
    alert("Please write something!");
    return;
}

document.getElementById("output").innerHTML = "Generating...";

setTimeout(() => {
    let result = "Professional Document:\n\n" + text + "\n\nConclusion:\nThis document was generated successfully using Dark Docs AI system.";

    document.getElementById("output").innerText = result;
}, 1000);
```

}


function pay(){
let content = document.getElementById("output").innerText;

```
if(!content){
    alert("Generate document first!");
    return;
}

let newWindow = document.createElement("iframe");
newWindow.style.display = "none";
document.body.appendChild(newWindow);

newWindow.contentDocument.write(`
    <html>
    <head>
    <title>Dark Docs</title>
    <style>
    body{font-family:Arial;padding:40px;}
    h1{color:#5a3e2b;}
    </style>
    </head>
    <body>
    <h1>Dark Docs Document</h1>
    <hr>
    <p>${content.replace(/\n/g, "<br>")}</p>
    </body>
    </html>
`);

newWindow.contentWindow.print();
```

}



    let blob = new Blob([content], { type: "application/pdf" });
    let link = document.createElement("a");

    link.href = URL.createObjectURL(blob);
    link.download = "dark-docs.pdf";
    link.click();
}

</script>

</body>
</html>
