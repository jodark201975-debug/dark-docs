<!DOCTYPE html>

<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Dark Docs</title>

<style>
body{
    font-family: Arial;
    background:#f4efe6;
    text-align:center;
    padding:40px;
}
.container{
    max-width:600px;
    margin:auto;
}
textarea{
    width:100%;
    height:150px;
    padding:10px;
}
button{
    margin-top:15px;
    padding:12px 20px;
    background:#5a3e2b;
    color:white;
    border:none;
    cursor:pointer;
}
#output{
    margin-top:20px;
    background:white;
    padding:15px;
    min-height:100px;
}
</style>

</head>

<body>

<div class="container">

<h1>Dark Docs</h1>

<textarea id="input" placeholder="اكتب هنا..."></textarea>

<br>

<button onclick="generate()">Generate</button>

<div id="output"></div>

<button onclick="downloadPDF()">Download PDF</button>

</div>

<script>

function generate(){
let text = document.getElementById("input").value;

```
if(!text){
    alert("اكتب حاجة الأول");
    return;
}

document.getElementById("output").innerHTML = `
<h2 style="color:#5a3e2b;">📄 مستند احترافي</h2>

<h3>📌 الموضوع:</h3>
<p>${text}</p>

<h3>📖 المحتوى:</h3>
<p>
هذا مستند احترافي تم إنشاؤه باستخدام نظام Dark Docs.  
يحتوي على معلومات منظمة وتنسيق واضح يسهل قراءته واستخدامه.
</p>

<h3>✅ الخلاصة:</h3>
<p>
تم إنشاء هذا المستند بنجاح ويمكن استخدامه بشكل رسمي أو عملي.
</p>
`;
```

}

function downloadPDF(){
let content = document.getElementById("output").innerHTML;

```
if(!content){
    alert("اعمل Generate الأول");
    return;
}

let win = window.open('', '', 'width=800,height=600');
win.document.write(`
    <html>
    <head>
    <title>Dark Docs</title>
    <style>
    body{font-family:Arial;padding:40px;line-height:1.8;}
    h2{color:#5a3e2b;}
    </style>
    </head>
    <body>
    ${content}
    </body>
    </html>
`);

win.document.close();
win.print();
```

}

</script>

</body>
</html>
