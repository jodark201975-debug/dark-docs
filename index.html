<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dark Docs</title>

<script src="https://js.puter.com/v2/"></script>

<style>
body{
    font-family: Arial;
    background:#f4efe6;
    text-align:center;
    padding:40px;
}
.container{
    max-width:600px;
    margin:auto;
}
h1{
    color:#5a3e2b;
}
textarea{
    width:100%;
    height:150px;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
}
button{
    margin-top:15px;
    padding:12px 20px;
    background:#5a3e2b;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
#output{
    margin-top:20px;
    background:white;
    padding:15px;
    border-radius:8px;
    text-align:left;
    min-height:100px;
}
.pay{
    margin-top:20px;
    background:#000;
}
</style>

</head>

<body>

<div class="container">

<h1>Dark Docs</h1>
<p>Turn Ideas Into Professional Documents Instantly</p>

<textarea id="input" placeholder="Write what you want..."></textarea>

<button onclick="generate()">Generate</button>

<div id="output"></div>

<button class="pay" onclick="pay()">Download PDF</button>

</div>

<script>

function generate(){
    let text = document.getElementById("input").value;

    document.getElementById("output").innerHTML = "Generating...";

    puter.ai.chat("Create a professional document: " + text)
    .then(res => {
        document.getElementById("output").innerText = res;
    });
}

function pay(){
    let content = document.getElementById("output").innerText;

    if(!content){
        alert("Generate document first!");
        return;
    }

    let blob = new Blob([content], { type: "application/pdf" });
    let link = document.createElement("a");

    link.href = URL.createObjectURL(blob);
    link.download = "dark-docs.pdf";
    link.click();
}

</script>

</body>
</html>
