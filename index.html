<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Dark AI Docs Pro</title>

<!-- PDF + Screenshot -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Tahoma;
    text-align:center;
    padding:30px;
}
.container{
    max-width:800px;
    margin:auto;
}
textarea{
    width:100%;
    height:150px;
    border-radius:10px;
    padding:10px;
}
select,button{
    margin-top:10px;
    padding:10px;
    border:none;
    border-radius:8px;
}
button{
    background:#22c55e;
    color:white;
    cursor:pointer;
}
#output{
    background:white;
    color:black;
    padding:20px;
    border-radius:10px;
    margin-top:20px;
    text-align:right;
    direction:rtl;
}
</style>

</head>

<body>

<div class="container">

<h1>🔥 Dark AI Docs Pro</h1>

<textarea id="input" placeholder="اكتب طلبك (قصة - مقال - سيناريو)..."></textarea>

<br>

<select id="type">
<option value="article">مقال احترافي</option>
<option value="story">قصة</option>
<option value="cinematic">برومبت سينمائي</option>
</select>

<br>

<button onclick="generate()">✨ Generate</button>

<div id="output"></div>

<button onclick="downloadPDF()">📥 تحميل PDF</button>

</div>

<script>

async function generate(){

let text = document.getElementById("input").value;
let type = document.getElementById("type").value;

if(!text){
    alert("اكتب حاجة");
    return;
}

document.getElementById("output").innerHTML = "⏳ جاري التوليد...";

let prompt = "";

if(type==="article"){
    prompt = `اكتب مقال احترافي عن: ${text}`;
}
else if(type==="story"){
    prompt = `اكتب قصة مشوقة عن: ${text}`;
}
else{
    prompt = `اكتب وصف سينمائي احترافي لـ: ${text}`;
}

try{
    let response = await fetch("https://api-inference.huggingface.co/models/google/flan-t5-large",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            inputs: prompt
        })
    });

    let data = await response.json();

    let result = data[0]?.generated_text || "حصل خطأ";

    document.getElementById("output").innerHTML = `
    <h2>✨ النتيجة</h2>
    <p>${result}</p>
    `;

}catch(e){
    document.getElementById("output").innerHTML = "❌ فشل الاتصال";
}

}
async function downloadPDF(){

let element = document.getElementById("output");

if(!element.innerText){
alert("اعمل Generate الأول");
return;
}

const canvas = await html2canvas(element);
const imgData = canvas.toDataURL("image/png");

const { jsPDF } = window.jspdf;
const pdf = new jsPDF();

pdf.addImage(imgData, 'PNG', 10, 10, 180, 0);

pdf.save("DarkDocs.pdf");

}

</script>

</body>
</html>
