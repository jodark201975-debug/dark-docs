<!DOCTYPE html>

<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Dark Docs</title>

<style>
body{
    font-family: Arial;
    background:#f4efe6;
    text-align:center;
    padding:40px;
}
.container{
    max-width:600px;
    margin:auto;
}
textarea{
    width:100%;
    height:150px;
    padding:10px;
}
button{
    margin-top:15px;
    padding:12px 20px;
    background:#5a3e2b;
    color:white;
    border:none;
    cursor:pointer;
}
#output{
    margin-top:20px;
    background:white;
    padding:15px;
    min-height:100px;
}
</style>

</head>

<body>

<div class="container">

<h1>Dark Docs</h1>

<textarea id="input" placeholder="اكتب هنا..."></textarea>

<br>

<button onclick="generate()">Generate</button>

<div id="output"></div>

<button onclick="downloadPDF()">Download PDF</button>

</div>

<script>

function generate(){
    let text = document.getElementById("input").value;

    if(!text){
        alert("اكتب حاجة الأول");
        return;
    }

    document.getElementById("output").innerText =
    "📄 مستند احترافي:\n\n" + text +
    "\n\n✅ تم الإنشاء بنجاح";
}

function downloadPDF(){
    let content = document.getElementById("output").innerText;

    if(!content){
        alert("اعمل Generate الأول");
        return;
    }

    let blob = new Blob([content], { type: "text/plain" });
    let link = document.createElement("a");

    link.href = URL.createObjectURL(blob);
    link.download = "dark-docs.txt";
    link.click();
}

</script>

</body>
</html>
