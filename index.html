<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Dark Docs Pro</title>

<!-- مكتبة PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
    font-family: Arial;
    background:#0f172a;
    color:white;
    text-align:center;
    padding:40px;
}
.container{
    max-width:700px;
    margin:auto;
}
textarea{
    width:100%;
    height:150px;
    padding:10px;
    border-radius:10px;
    border:none;
}
button{
    margin-top:15px;
    padding:12px 20px;
    background:#22c55e;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}
button:hover{
    background:#16a34a;
}
#output{
    margin-top:20px;
    background:white;
    color:black;
    padding:20px;
    border-radius:10px;
    min-height:120px;
    text-align:right;
}
</style>

</head>

<body>

<div class="container">

<h1>🚀 Dark Docs Pro</h1>

<textarea id="input" placeholder="اكتب طلبك هنا..."></textarea>

<br>

<button onclick="generate()">✨ Generate</button>

<div id="output"></div>

<button onclick="downloadPDF()">📥 Download PDF</button>

</div>

<script>

function generate(){

let text = document.getElementById("input").value;

if(!text){
    alert("اكتب حاجة الأول");
    return;
}

let result = `
<h2 style="color:#16a34a;">📄 مستند احترافي</h2>

<p><strong>📌 الموضوع:</strong> ${text}</p>

<p><strong>📖 المحتوى:</strong><br>
هذا تقرير احترافي تم إنشاؤه تلقائيًا باستخدام نظام Dark Docs Pro.
يتميز بالتنظيم والدقة وسهولة القراءة.
</p>

<p><strong>✅ الخلاصة:</strong><br>
تم إنشاء المستند بنجاح ويمكن استخدامه بشكل رسمي.
</p>
`;

document.getElementById("output").innerHTML = result;

}

async function downloadPDF(){

let content = document.getElementById("output").innerText;

if(!content){
    alert("اعمل Generate الأول");
    return;
}

const { jsPDF } = window.jspdf;
const doc = new jsPDF();

doc.setFont("Arial");
doc.setFontSize(14);

// تقسيم النص علشان ينزل صح في PDF
let lines = doc.splitTextToSize(content, 180);

doc.text(lines, 10, 10);

doc.save("DarkDocs.pdf");

}

</script>

</body>
</html>
